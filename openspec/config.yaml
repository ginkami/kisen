schema: spec-driven

context: |
  # Kisen / shogi·world — OpenSpec project context

  ## Project overview
  Kisen (shogi·world) is a single-page application for creating, managing, and publishing shogi (Japanese chess) tournaments. It is built as an MVP with a clean, layered architecture that isolates the Firebase backend so it can later be replaced by a custom backend without rewriting UI or domain logic.

  ## Tech stack
  - Build tool: Vite 8 (`vite.config.ts`)
  - Framework: React 19 + TypeScript 6 (strict mode, ES modules, `type: "module"`)
  - Routing: React Router 7 (`BrowserRouter`)
  - Styling: Tailwind CSS 4 + daisyui 5 (`src/index.css`)
  - State & server cache: TanStack Query 5 (`src/queryClient.ts`, `networkMode: 'offlineFirst'`)
  - Backend (MVP): Firebase Auth + Cloud Firestore (Firebase SDK 12)
  - Validation: Zod 4 (`src/domain/*.ts`)
  - Testing: Vitest + happy-dom + React Testing Library (`src/test/setup.ts`)
  - i18n: i18next + react-i18next + browser language detector, locales `ru` and `en`
  - Utilities: uuidv7 for entity IDs, idb for local IndexedDB draft storage
  - Icons: @heroicons/react

  ## Project structure
  ```
  schemas/                # Human-readable JSONC specs + small TS value objects
  src/
    components/           # React components (UI + form sections)
    context/              # React contexts (AuthContext)
    domain/               # Pure TypeScript domain models and Zod schemas (source of truth)
    hooks/                # Custom React hooks (e.g. useTournamentForm)
    i18n/                 # i18n setup
    locales/              # Translation files: en/translation.json, ru/translation.json
    pages/                # Route-level page components
    services/             # Service layer + Firebase-specific repository implementations
    test/                 # Test setup
    types/                # Additional TypeScript domain types
    utils/                # Helper utilities
  firestore.rules         # Firestore security rules
  firestore.indexes.json  # Firestore composite indexes
  firebase.json           # Firebase project configuration
  ```

  ## Architecture principles
  - **Layered architecture with vendor isolation:**
    - `src/domain/` — pure TypeScript models and Zod schemas; no Firebase or React imports.
    - `src/services/` — contains service classes that implement business logic (e.g. `TournamentService`, `EventService`) and repository interfaces.
    - `src/services/firestore*.ts` — Firebase-specific repository implementations. These are the only files that import from `firebase/firestore` (besides `firebaseConfig.ts` and `authService.ts`).
    - `src/context/`, `src/components/`, `src/pages/` — presentation and React-specific application state.
  - **Service + Repository pattern:** Services orchestrate business logic and depend on repository interfaces (`TournamentRepository`, `EventRepository` in `src/services/repository.ts`). Repositories handle persistence details.
  - **Source of truth for data shapes:** `src/domain/*.ts` Zod schemas. JSONC files under `schemas/` document field-level intent; keep them coherent with the TypeScript schemas.
  - **ES modules with explicit extensions:** imports use `.ts` extensions (e.g. `../domain/tournament.ts`). Prefer named exports and `type` imports for types.
  - **Offline-first cache:** TanStack Query `networkMode: 'offlineFirst'`, staleTime 60s, gcTime 10m.

  ## Domain entities
  Core Firestore collections:
  - `users` — app user profiles. `id` is the Firebase Auth UID. Contains `email`, `role` (`user` | `manager` | `admin`), `auth` block (providers, passwordHash, emailVerified, isActive), and locale-specific names.
  - `associations` — groups that own players, tournaments, and events. Have `managers` (UID array), `pendingInvites` (email array), localized title/description/location, slug, country.
  - `players` — shogi players with localized names, nationality/residence, gender, current rating/rank, birth date, primary/secondary association links.
  - `tournaments` — tournament metadata, schedule (events + rounds), settings (time control + tie-breaks), country, chief arbiter, participants, games, status, slug, host association, parent event.
  - `events` — groupings of tournaments (championship stages, leagues, etc.).

  ## Identifiers and slugs
  - Entity IDs are UUIDv7 generated by `uuidv7` (except `users`, which use Firebase UID).
  - Public-facing resources use URL-safe slugs: lowercase latin letters, digits, hyphens, minimum length 3. Slug normalization/validation is centralized in `src/services/slugService.ts` (`normalizeSlug`, `isValidSlug`, `generateRandomSlug`). Services resolve slug uniqueness.

  ## Localization conventions
  - Supported locales: `ru`, `en`. Fallback is `ru`.
  - Localized fields are modeled as `Record<SupportedLocale, T>` via `localeSchema<T>()` in `src/domain/locale.ts`.
  - At least one locale must be present. UI rendering picks the current locale if available, otherwise the first available locale.
  - All new user-facing strings must be added to both `src/locales/en/translation.json` and `src/locales/ru/translation.json`.

  ## Tournament lifecycle and rules
  - Statuses: `draft` → `upcoming` → `ongoing` → `finished`; also `canceled`, `proposed_for_removing`.
  - Drafts are private (`isPublic == false`). Publication sets status to `upcoming` and `isPublic` to `true`.
  - `isPublic` is derived from status and must stay in sync (see `isValidPublicStatus()` in `firestore.rules` and `TournamentService.update`).
  - Editing a tournament after its first round start time automatically transitions it to `ongoing`.
  - Publishing validates the shape via `publishedTournamentSchema` (non-empty title/location, required 2-letter country, at least one round, etc.).

  ## Security model
  - Authentication via Firebase Auth (email/password + Google).
  - Admin role is granted through Firebase Custom Claims: `request.auth.token.admin == true`.
  - Manager access to an association is determined by the `managers` array in the `associations` document.
  - Firestore security rules (`firestore.rules`) enforce:
    - Users read/create/update own profile; admins can read/update/delete any.
    - Associations are public read; write restricted to admins and association managers.
    - Players are public read; write restricted to admins, owner (`createdBy`), or managers of the player's `primaryAssociation`.
    - Tournaments are public read only when `isPublic == true`; write restricted to admin, owner (`createdBy`), or managers of `hostAssociation`. Host-association changes require manager rights on the new association; `isPublic` must remain consistent with status.
    - Events are public read; write restricted to admin, owner, or managers of `hostAssociation`.

  ## Conventions and style
  - TypeScript strict. Prefer `interface` for public shapes and `type` for unions/derived types.
  - Use Zod discriminated unions for variant data (e.g. `timeControlSchema`, `tieBreakSchema`).
  - Date values in domain models are JS `Date` objects. Conversion to/from Firestore `Timestamp` happens only inside repository implementations (`datesToTimestamps` / `timestampsToDates`).
  - Async mutations go through TanStack Query `useMutation`. After successful mutations, invalidate relevant query keys (e.g. `[TOURNAMENT_QUERY_KEY, id]`, `['adminTournaments']`).
  - Form state is managed in hooks (`useTournamentForm`) and kept separate from domain models. Use JSON-string snapshots to detect unsaved changes.
  - IndexedDB (`idb`) is used only for local draft snapshots; the public API surface lives in `src/utils/tournamentDraftStorage.ts`.

rules:
  proposal:
    - Keep proposals concise but include the affected domain entities, Firestore collections, and security-rule implications.
    - Always include a "Non-goals" section to separate adjacent concerns.
    - If a change introduces a new Firestore query or filter, explicitly mention the need for a composite index in `firestore.indexes.json`.
    - Testing Strategy: Every proposal must explicitly state what tests will be added or updated, defining unit tests for services/domain models and component/hook tests for UI features.

  design:
    - When designing any feature that reads from or writes to Firestore, first inspect and, if necessary, update `firestore.rules` so that the client-side operation will be permitted.
    - Whenever a change touches tournament fields (country, online flag, arbiter model, etc.), review `firestore.rules` and the Zod schema in `src/domain/tournament.ts` for consistency.
    - When a rule change affects data visibility, also update the corresponding Zod schema in `src/domain/` and the JSONC spec in `schemas/`.
    - For every new query that uses multiple `where` clauses or an `orderBy`, verify that `firestore.indexes.json` already contains the required index or propose adding it.
    - Respect the layered architecture: domain logic must not import Firebase or React; services must not import React; components must not import `firebase/*` directly.
    - Always route slug creation/normalization/validation through `src/services/slugService.ts` and ensure uniqueness checks inside the service layer.
    - Test-Driven Design: Define the inputs, outputs, and failure states for any service or domain utility *before* implementation, so they can be written as clear Vitest specifications.
    - Optimistic UI Strategy: For state-changing mutations (e.g., status changes, participant enrollment), design a rollback mechanism using TanStack Query's `onMutate`, `onError`, and `onSettled` hooks to ensure immediate visual feedback for the user.
    - Transactional Integrity: Any multi-document update or cross-collection operation (e.g., creating a tournament while registering its parent event) must be designed using Firestore's `writeBatch` or `runTransaction` to prevent partial commits.

  implementation:
    - Preserve existing import style: ES modules with explicit `.ts` extensions, named exports, and `type` imports for types only.
    - Keep date <-> Timestamp conversion isolated in Firestore repository files.
    - Add or update i18n keys in both `src/locales/en/translation.json` and `src/locales/ru/translation.json`.
    - Use `publishedTournamentSchema` and other published/draft Zod schemas for status-sensitive validation rather than duplicating rules inline.
    - After mutations, invalidate the relevant TanStack Query keys (e.g. `['tournament', id]`, `['adminTournaments']`).
    - Do not hardcode locale lists; derive them from `supportedLocales` in `src/domain/locale.ts`.
    - IP-based defaults must never block draft creation: always provide a fallback country and city.
    - Testing Rules:
      - Co-location: Place test files directly adjacent to the file they are testing (e.g. `src/domain/tournament.test.ts` next to `src/domain/tournament.ts`).
      - Domain Coverage: Pure domain files (`src/domain/`) and validation schemas must have 100% unit-test coverage focusing on both valid structures and validation error cases.
      - Service Mocking: Service-layer tests must mock the Firestore repository implementations completely using Vitest (`vi.mock`). Unit and integration tests must NEVER make real network requests to Firebase or depend on initialized Firebase SDKs.
      - Hook Isolation: Test custom hooks (like `useTournamentForm`) using `@testing-library/react`'s `renderHook`. Wrap them in necessary providers (QueryClientProvider, Router, AuthContext) using reusable test wrappers from `src/test/setup.ts`.
      - Component Testing: Use React Testing Library (RTL) for testing user interactions (`userEvent`). Ensure proper cleanup of mock routers (React Router 7) and auth context.
      - No Raw Locales in UI: UI text assertions in tests should reference keys or mock implementations of `t()` to prevent breaking when locales change.
    - Strict Boundary Parsing: Never return untyped Firestore documents to the service or view layer. Repository implementations must parse raw Firestore data using Zod's `.safeParse()` immediately at the data-access boundary to catch corrupted data early.
    - daisyUI 5 Theme Safety: Never use arbitrary colors or hardcoded hex codes (e.g., `text-[#1a202c]` or `bg-[#fff]`). Only use semantic Tailwind/daisyUI design tokens (`bg-base-100`, `text-base-content`, `btn-primary`, `border-base-300`) to guarantee full dark/light theme compliance.
    - Localized Rendering Safeguards: Never render localized values using direct object access with hardcoded keys (e.g., `name.ru`). Always pass the current active locale from i18next and resolve translations using a safe domain-level utility that handles language fallback logic gracefully.

  review:
    - Before marking a task complete, confirm that `npm run lint` and `npm run test:run` would pass, or document the exceptions.
    - Re-read `firestore.rules` and `firestore.indexes.json` whenever a feature touches authentication, roles, collections, or queries.
    - Test Quality Review:
      - Verify that mocks are explicitly cleared or restored between tests (`afterEach(() => vi.clearAllMocks())` or `vi.restoreAllMocks()`) to avoid state leaks.
      - Ensure there are no unhandled promise rejections or console errors/warnings (such as React 19 `'act'` or key warnings) printed during test execution.
      - Confirm that tests cover negative/unhappy paths (e.g., Firestore permission errors, validation failures, empty lists, offline behavior).
      - Translation Coverage: Verify that no user-facing text is hardcoded in React components or hooks. All strings, including placeholders, alt-texts, and ARIA labels, must use the `t()` function.
    - Unused Component Cleanup: Ensure that newly introduced components do not leak performance. Double-check that any EventListeners or custom subscriptions are properly terminated inside cleanup functions.